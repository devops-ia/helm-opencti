sources:
  eck-stack:
    kind: helmchart
    spec:
      url: https://helm.elastic.co
      name: eck-stack
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: eck-stack
  rustfs:
    kind: helmchart
    spec:
      url: https://charts.rustfs.com
      name: rustfs
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: rustfs
  opensearch:
    kind: helmchart
    spec:
      url: https://opensearch-project.github.io/helm-charts/
      name: opensearch
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: opensearch
  dragonfly:
    kind: dockerimage
    spec:
      image: ghcr.io/dragonflydb/dragonfly/helm/dragonfly
      name: dragonfly
      versionFilter:
        kind: semver
        pattern: '*' # replace with CI/CD updatecli
    sourceid: dragonfly
  rabbitmq:
    kind: helmchart
    spec:
      name: rabbitmq
      url: oci://registry-1.docker.io/bitnamicharts
      versionFilter:
        kind: semver
        pattern: '*'
conditions: {}
targets:
  eck-stack:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/opencti/Chart.yaml
      key: $.dependencies[0].version
    sourceid: eck-stack
  rustfs:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/opencti/Chart.yaml
      key: $.dependencies[1].version
    sourceid: rustfs
  opensearch:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/opencti/Chart.yaml
      key: $.dependencies[2].version
    sourceid: opensearch
  dragonfly:
    name: bump chart dependencies
    kind: yaml
    spec:
      file: charts/opencti/Chart.yaml
      key: $.dependencies[4].version
    sourceid: dragonfly
