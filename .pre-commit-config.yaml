repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
    rev: v1.1.2
    hooks:
      - id: markdown-toc
        args: [--maxdepth=3]
        files: ^(README\.md|CONTRIBUTING\.md|TESTING\.md)$

  # helm lint also checks Chart.yaml and validates values.yaml against the schema
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
        args:
          - charts/opencti
      - id: shellcheck

  - repo: local
    hooks:
      # built from source so it works without the Helm plugin (Helm 4 refuses unverified plugins)
      - id: helm-schema
        name: Generate values.schema.json
        language: golang
        additional_dependencies:
          - github.com/losisin/helm-values-schema-json/v2@v2.6.0
        entry: bash -c 'cd charts/opencti && helm-values-schema-json'
        files: ^charts/opencti/(values\.yaml|\.schema\.yaml)$
        pass_filenames: false

  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        args:
          - --chart-search-root=charts
          - --template-files=README.md.gotmpl
          - --document-dependency-values

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: "Check values.schema.json"
        files: values\.schema\.json$
        args: ["--schemafile", "https://json-schema.org/draft-07/schema"]
