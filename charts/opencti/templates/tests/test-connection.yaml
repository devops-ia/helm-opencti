{{ if .Values.testConnection }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opencti.fullname" . }}-test-connection"
  labels:
    {{- include "opencti.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      {{- if .Values.global.imageRegistry }}
      image: "{{ .Values.global.imageRegistry }}/busybox:1.37.0"
      {{- else }}
      image: busybox:1.37.0
      {{- end }}
      # Retry: the server may still be starting right after an upgrade (e.g. probes disabled)
      command: ['sh', '-c']
      args:
        - for i in $(seq 1 24); do wget -q -T 5 -O /dev/null {{ include "opencti.fullname" . }}-server:{{ .Values.service.port }} && exit 0; sleep 10; done; exit 1
  restartPolicy: Never
{{ end }}
